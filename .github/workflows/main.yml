name: Analyse de sécurité Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Scan de sécurité
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache automatique des dépendances pip pour accélérer le workflow

      - name: Installation des outils de sécurité
        run: |
          python -m pip install --upgrade pip
          pip install 'bandit[sarif]' safety

      - name: Exécution de Bandit (analyse statique du code)
        run: |
          # Analyse récursive avec Bandit, sortie au format SARIF
          bandit -r . -f sarif -o bandit-results.sarif -ll --exit-zero

      - name: Upload des résultats Bandit vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3 # Version stable recommandée
        if: always()
        with:
          sarif_file: bandit-results.sarif

      - name: Exécution de Safety (vulnérabilités des dépendances)
        run: |
          # Génération d'un rapport SARIF pour Safety pour centraliser les alertes dans GitHub Security
          safety check --sarif > safety-results.sarif || true
        continue-on-error: true

      - name: Upload des résultats Safety vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: safety-results.sarif
