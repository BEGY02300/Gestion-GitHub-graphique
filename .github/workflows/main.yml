name: Analyse de sécurité Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Scan de sécurité
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des outils de sécurité
        run: |
          python -m pip install --upgrade pip
          # Installation de Bandit avec le support SARIF + Safety
          pip install 'bandit[sarif]' safety

      - name: Exécution de Bandit (analyse du code)
        run: |
          # L'option --exit-zero évite de faire échouer le job si des problèmes sont trouvés
          bandit -r . -f sarif -o bandit-results.sarif -ll --exit-zero

      - name: Upload des résultats Bandit vers GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-results.sarif

      - name: Exécution de Safety (vérification des dépendances)
        run: |
          safety check --full-report
        continue-on-error: true
